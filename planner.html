<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Planner — The Main Meal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <div class="auth-screen" id="loadingScreen">
    <h1>The Main Meal</h1>
    <p class="subtitle">Loading…</p>
  </div>

  <div class="app-content hidden" id="appContent">
  <div class="top-right-account">
    <button class="btn-ghost" id="signOutBtn">Sign out</button>
  </div>

  <div class="header-row">
    <div>
      <h1 id="pageTitle">Weekly Meal Planner</h1>
      <p class="subtitle">Coming soon</p>
    </div>
    <div class="header-actions">
      <a class="btn-ghost" href="index.html">← Back to meals</a>
    </div>
  </div>

  <div class="planner-placeholder">
    <p>The weekly meal planner isn't built yet — check back soon.</p>
  </div>
  </div>
</div>

<script type="module">
  import { auth } from "./firebase-init.js";
  import { signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

  const wasAlreadyAuthed = sessionStorage.getItem('mm-authed') === '1';
  if (wasAlreadyAuthed) {
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('appContent').classList.remove('hidden');
  }

  async function doSignOut() {
    try {
      sessionStorage.removeItem('mm-authed');
      sessionStorage.removeItem('mm-uid');
      await signOut(auth);
    } catch (e) {
      console.error('Sign out failed', e);
    }
  }
  document.getElementById('signOutBtn').onclick = doSignOut;

  onAuthStateChanged(auth, async (user) => {
    if (!user || !user.emailVerified) {
      sessionStorage.removeItem('mm-authed');
      sessionStorage.removeItem('mm-uid');
      window.location.href = 'signin.html';
      return;
    }
    if (!wasAlreadyAuthed) {
      try {
        await user.getIdToken(true);
      } catch (e) {
        console.error('Session is no longer valid, signing out', e);
        sessionStorage.removeItem('mm-authed');
        sessionStorage.removeItem('mm-uid');
        await signOut(auth).catch(() => {});
        return;
      }
    }
    sessionStorage.setItem('mm-authed', '1');
    sessionStorage.setItem('mm-uid', user.uid);
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('appContent').classList.remove('hidden');
  });
</script>

</body>
</html>
