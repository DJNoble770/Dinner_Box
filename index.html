<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dinner Box</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <div class="auth-screen" id="authScreen">
    <h1>The Main Meal</h1>
    <p class="subtitle">Sign in to see your own dinner box</p>
    <div class="auth-form">
      <input class="field-input" id="authEmail" type="email" placeholder="Email" autocomplete="email">
      <input class="field-input" id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
      <p class="auth-error hidden" id="authError"></p>
      <div class="auth-actions">
        <button class="save-btn" id="signInBtn">Sign in</button>
        <button class="cancel-btn" id="signUpBtn">Create account</button>
      </div>
    </div>
  </div>

  <div class="auth-screen hidden" id="verifyScreen">
    <h1>Verify your email</h1>
    <p class="subtitle" id="verifyEmailMsg">We've sent a verification link to your email.</p>
    <p class="auth-error hidden" id="verifyError"></p>
    <div class="auth-actions">
      <button class="save-btn" id="verifyContinueBtn">I've verified — continue</button>
    </div>
    <div class="auth-actions">
      <button class="cancel-btn" id="resendVerificationBtn">Resend email</button>
      <button class="cancel-btn" id="verifySignOutBtn">Sign out</button>
    </div>
  </div>

  <div class="app-content hidden" id="appContent">
  <div class="header-row">
    <div>
      <h1>The Main Meal</h1>
      <p class="subtitle" id="countLabel">0 ideas on file</p>
    </div>
    <div class="header-actions">
      <span class="user-email" id="userEmailLabel"></span>
      <button class="btn-ghost" id="signOutBtn">Sign out</button>
      <button class="btn-primary" id="addBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add dinner
      </button>
    </div>
  </div>

  <div class="form-wrap hidden" id="formWrap">
    <div class="form-header">
      <h3 id="formTitle">Add a dinner idea</h3>
      <button id="formCloseBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="form-grid">
      <div>
        <label class="field-label">Dish name</label>
        <input class="field-input" id="nameInput" placeholder="e.g. Honey garlic chicken thighs">
      </div>
      <div class="method-row">
        <div>
          <label class="field-label">Method</label>
          <select class="field-input" id="methodInput">
            <option value="">—</option>
            <option value="oven">Oven</option>
            <option value="airfryer">Air fryer</option>
            <option value="hob">Hob</option>
            <option value="grill">Grill</option>
            <option value="slow-cooker">Slow cooker</option>
            <option value="microwave">Microwave</option>
            <option value="bbq">BBQ</option>
          </select>
        </div>
        <div>
          <label class="field-label">Temperature (optional)</label>
          <input class="field-input" id="tempInput" placeholder="200C">
        </div>
        <div>
          <label class="field-label">Time (optional)</label>
          <input class="field-input" id="timeInput" placeholder="30 min">
        </div>
      </div>
      <div>
        <label class="field-label">Ingredients</label>
        <div class="ingredient-rows" id="ingredientRows"></div>
        <div class="ing-btn-row">
          <button type="button" class="add-ing-btn" id="addIngredientBtn">+ Add ingredient</button>
          <button type="button" class="add-ing-btn" id="macrosBtn">Edit macros</button>
        </div>
      </div>
      <div>
        <label class="field-label">Spices</label>
        <div class="spice-rows" id="spiceRows"></div>
        <button type="button" class="add-ing-btn" id="addSpiceBtn">+ Add spice</button>
      </div>
      <div>
        <label class="field-label">Recipe steps (optional)</label>
        <textarea class="field-textarea" id="stepsInput" rows="5" placeholder="1. Marinate the chicken&#10;2. Bake at 200C for 25 min&#10;3. Rest for 5 min before serving"></textarea>
      </div>
      <div class="form-actions">
        <button class="save-btn" id="saveBtn">Add to the box</button>
        <button class="cancel-btn" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <div class="filters" id="filterRow"></div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A9B96" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="Search by name or ingredient">
    </div>
    <button class="btn-ghost" id="pickBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      Pick for me
    </button>
  </div>

  <div class="grid" id="cardGrid"></div>
  </div>
</div>

<div class="modal-overlay hidden" id="macrosModal">
  <div class="modal-panel">
    <div class="form-header">
      <h3>Edit macros</h3>
      <button id="macrosModalCloseBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="macros-modal-list" id="macrosModalList"></div>
    <div class="form-actions">
      <button class="save-btn" id="macrosModalSaveBtn">Save macros</button>
      <button class="cancel-btn" id="macrosModalCancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyADDooNjHzYrOHLigjXSVypWgGrZzW4VR8",
    authDomain: "dinner-box-f8c64.firebaseapp.com",
    projectId: "dinner-box-f8c64",
    storageBucket: "dinner-box-f8c64.firebasestorage.app",
    messagingSenderId: "285616906292",
    appId: "1:285616906292:web:4d4b5b47afd19546e0aa61"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  let dinnerDocRef = null;
  let stopSync = null;

  const PROTEINS = [
    { id: 'chicken', label: 'Chicken',        color: '#B5772E', bg: '#F3E3CB' },
    { id: 'beef',    label: 'Beef',           color: '#8C3B2E', bg: '#EAD3CB' },
    { id: 'pork',    label: 'Pork',           color: '#A14E63', bg: '#F0DCE1' },
    { id: 'fish',    label: 'Fish / seafood', color: '#2E6E8C', bg: '#D6E7EE' },
    { id: 'other',   label: 'Other',          color: '#6B6357', bg: '#E7E2D6' },
  ];

  const PROTEIN_KEYWORDS = {
    chicken: ['chicken', 'poultry', 'turkey'],
    beef: ['beef', 'steak', 'mince', 'burger', 'meatball', 'brisket'],
    pork: ['pork', 'bacon', 'ham', 'sausage', 'chorizo', 'gammon'],
    fish: ['fish', 'salmon', 'tuna', 'cod', 'prawn', 'shrimp', 'seafood', 'haddock', 'mackerel', 'anchov'],
  };

  function detectProteinFromName(name) {
    const n = (name || '').toLowerCase();
    for (const id of Object.keys(PROTEIN_KEYWORDS)) {
      if (PROTEIN_KEYWORDS[id].some(kw => n.includes(kw))) return id;
    }
    return 'other';
  }

  const proteinMeta = id => PROTEINS.find(p => p.id === id) || PROTEINS[PROTEINS.length - 1];

  const UNITS = ['g', 'kg', 'ml', 'l', 'tsp', 'tbsp', 'cup', 'oz', 'lb', 'pinch', 'whole'];

  const FDC_API_KEY = 'Nx3We7Na5FftKtPxrorL6upc9VBHVHQrJHuq39ZQ';
  const UNIT_TO_GRAMS = { g: 1, kg: 1000, ml: 1, l: 1000, tsp: 5, tbsp: 15, cup: 240, oz: 28.3495, lb: 453.592 };
  const macroLookupCache = new Map();

  const MACRO_STOPWORDS = new Set(['and', 'with', 'in', 'the', 'of', 'a', 'an', 'or']);

  function tokenize(str) {
    return (str || '').toLowerCase().split(/[^a-z]+/).filter(w => w.length >= 2 && !MACRO_STOPWORDS.has(w));
  }

  function tokensOverlap(a, b) {
    return a === b || (a.length >= 4 && b.length >= 4 && (a.startsWith(b.slice(0, 4)) || b.startsWith(a.slice(0, 4))));
  }

  function pickBestFood(query, foods) {
    const queryTokens = tokenize(query);
    let best = null;
    let bestCleanCount = -1;
    let bestPositionSum = Infinity;

    foods.forEach(food => {
      const descTokens = tokenize(food.description);
      const segments = food.description.split(',').map(seg => tokenize(seg));

      let positionSum = 0;
      let matchedCount = 0;
      queryTokens.forEach(qt => {
        const idx = descTokens.findIndex(dt => tokensOverlap(qt, dt));
        if (idx === -1) {
          positionSum += descTokens.length + 5;
        } else {
          positionSum += idx;
          matchedCount++;
        }
      });
      if (matchedCount === 0) return;

      const cleanCount = queryTokens.filter(qt =>
        segments.some(seg =>
          seg.some(t => tokensOverlap(qt, t)) &&
          seg.every(t => queryTokens.some(q2 => tokensOverlap(q2, t)))
        )
      ).length;

      if (cleanCount > bestCleanCount || (cleanCount === bestCleanCount && positionSum < bestPositionSum)) {
        bestCleanCount = cleanCount;
        bestPositionSum = positionSum;
        best = food;
      }
    });

    return best || foods[0];
  }

  async function fetchMacrosPer100g(name, state) {
    const cacheKey = `${name.trim().toLowerCase()}|${state || ''}`;
    if (macroLookupCache.has(cacheKey)) return macroLookupCache.get(cacheKey);

    const query = state ? `${name}, ${state}` : name;
    const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${FDC_API_KEY}&query=${encodeURIComponent(query)}&pageSize=10&dataType=Foundation,SR%20Legacy`;

    let result = null;
    try {
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        const food = data.foods && data.foods.length ? pickBestFood(query, data.foods) : null;
        if (food) {
          const getNutrient = (...numbers) => {
            for (const number of numbers) {
              const n = (food.foodNutrients || []).find(fn => String(fn.nutrientNumber) === number);
              if (n) return n.value || 0;
            }
            return 0;
          };
          result = {
            calories: getNutrient('208', '957', '958'),
            protein: getNutrient('203'),
            carbs: getNutrient('205'),
            fat: getNutrient('204'),
            matchedName: food.description,
          };
        }
      }
    } catch (e) {
      console.error('Macro lookup failed', e);
    }

    macroLookupCache.set(cacheKey, result);
    return result;
  }

  function scaleMacros(per100g, amount, unit) {
    const gramsPerUnit = UNIT_TO_GRAMS[unit];
    const qty = parseFloat(amount);
    if (!per100g || !gramsPerUnit || !qty) return null;
    const grams = qty * gramsPerUnit;
    const scale = grams / 100;
    return {
      calories: Math.round(per100g.calories * scale),
      protein: Math.round(per100g.protein * scale * 10) / 10,
      carbs: Math.round(per100g.carbs * scale * 10) / 10,
      fat: Math.round(per100g.fat * scale * 10) / 10,
      matchedName: per100g.matchedName,
    };
  }

  function dinnerMacroTotals(dinner) {
    const totals = { calories: 0, protein: 0, carbs: 0, fat: 0 };
    let hasAny = false;
    (dinner.ingredients || []).forEach(i => {
      if (i && i.macros) {
        hasAny = true;
        totals.calories += i.macros.calories || 0;
        totals.protein += i.macros.protein || 0;
        totals.carbs += i.macros.carbs || 0;
        totals.fat += i.macros.fat || 0;
      }
    });
    return hasAny ? totals : null;
  }

  const STATES = [
    { value: '', label: '—' },
    { value: 'raw', label: 'Raw' },
    { value: 'cooked', label: 'Cooked' },
  ];

  const METHODS = [
    { value: '', label: '—' },
    { value: 'oven', label: 'Oven' },
    { value: 'airfryer', label: 'Air fryer' },
    { value: 'hob', label: 'Hob' },
    { value: 'grill', label: 'Grill' },
    { value: 'slow-cooker', label: 'Slow cooker' },
    { value: 'microwave', label: 'Microwave' },
    { value: 'bbq', label: 'BBQ' },
  ];

  const methodLabel = id => (METHODS.find(m => m.value === id) || {}).label || '';

  const seedData = [
    {
      id: 'seed-1',
      name: 'Honey garlic chicken thighs',
      protein: 'chicken',
      ingredients: [
        { name: 'Chicken thighs', amount: '600', unit: 'g' },
        { name: 'Honey', amount: '2', unit: 'tbsp' },
        { name: 'Garlic', amount: '3', unit: 'whole' },
        { name: 'Soy sauce', amount: '2', unit: 'tbsp' },
        { name: 'Rice', amount: '300', unit: 'g' },
      ],
      spices: ['Salt', 'Black pepper', 'Ground ginger'],
      method: 'oven',
      temp: '200C',
      time: '35 min',
      steps: 'Marinate the chicken thighs for 20 min.\nBake at 200C, basting halfway through.\nServe over the rice.',
    },
    {
      id: 'seed-2',
      name: 'Beef and ale stew',
      protein: 'beef',
      ingredients: [
        { name: 'Diced beef', amount: '800', unit: 'g' },
        { name: 'Ale', amount: '500', unit: 'ml' },
        { name: 'Carrots', amount: '3', unit: 'whole' },
        { name: 'Onion', amount: '1', unit: 'whole' },
        { name: 'Beef stock', amount: '400', unit: 'ml' },
        { name: 'Potatoes', amount: '4', unit: 'whole' },
      ],
      spices: ['Bay leaf', 'Thyme', 'Salt', 'Black pepper'],
      method: 'slow-cooker',
      temp: 'Low',
      time: '2 hr',
      steps: 'Brown the beef, then transfer to a slow cooker.\nAdd the ale, stock, carrots, onion, and potatoes.\nCook on low for 6-8 hours.',
    },
    {
      id: 'seed-3',
      name: 'Chickpea and spinach curry',
      protein: 'other',
      ingredients: [
        { name: 'Chickpeas', amount: '2', unit: 'cup' },
        { name: 'Spinach', amount: '200', unit: 'g' },
        { name: 'Coconut milk', amount: '400', unit: 'ml' },
        { name: 'Curry paste', amount: '2', unit: 'tbsp' },
        { name: 'Onion', amount: '1', unit: 'whole' },
        { name: 'Rice', amount: '300', unit: 'g' },
      ],
      spices: ['Cumin', 'Turmeric', 'Salt'],
      method: 'hob',
      temp: '',
      time: '25 min',
      steps: '',
    },
  ];

  let dinners = [];
  let activeFilters = [];
  let searchTerm = '';
  let editingId = null;
  let pickedId = null;

  function startSync(uid) {
    dinnerDocRef = doc(db, "dinnerBox", uid);
    stopSync = onSnapshot(dinnerDocRef, (snapshot) => {
      if (snapshot.exists()) {
        dinners = snapshot.data().dinners || [];
      } else {
        dinners = seedData;
        saveData();
      }
      renderAll();
    }, (error) => {
      console.error('Sync error, showing local view only', error);
      dinners = seedData;
      renderAll();
    });
  }

  let pendingSave = Promise.resolve();

  function saveData() {
    if (!dinnerDocRef) return Promise.resolve();
    const p = setDoc(dinnerDocRef, { dinners }, { merge: true }).catch(e => {
      console.error('Could not save to the database', e);
      alert('Could not save your changes to the database — they may be lost on reload. ' + (e.message || ''));
    });
    pendingSave = p;
    return p;
  }

  function renderFilters() {
    const row = document.getElementById('filterRow');
    row.innerHTML = '';

    const allChip = document.createElement('button');
    allChip.className = 'chip' + (activeFilters.length === 0 ? ' active-all' : '');
    allChip.textContent = 'All';
    allChip.onclick = () => { activeFilters = []; renderAll(); };
    row.appendChild(allChip);

    PROTEINS.forEach(p => {
      const active = activeFilters.includes(p.id);
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = p.label;
      if (active) {
        chip.style.border = `2px solid ${p.bg}`;
        chip.style.background = p.bg;
        chip.style.color = p.color;
      }
      chip.onclick = () => {
        activeFilters = activeFilters.includes(p.id)
          ? activeFilters.filter(f => f !== p.id)
          : [...activeFilters, p.id];
        renderAll();
      };
      row.appendChild(chip);
    });
  }

  function getFiltered() {
    let list = dinners;
    if (activeFilters.length > 0) {
      list = list.filter(d => activeFilters.includes(d.protein));
    }
    if (searchTerm.trim()) {
      const q = searchTerm.trim().toLowerCase();
      list = list.filter(d =>
        d.name.toLowerCase().includes(q) ||
        d.ingredients.some(i => (typeof i === 'string' ? i : i.name).toLowerCase().includes(q)) ||
        (d.spices || []).some(s => s.toLowerCase().includes(q))
      );
    }
    return list;
  }

  function renderCards() {
    const grid = document.getElementById('cardGrid');
    grid.innerHTML = '';
    const filtered = getFiltered();

    if (filtered.length === 0) {
      const msg = document.createElement('p');
      msg.className = 'empty-msg';
      msg.textContent = 'Nothing matches yet. Try a different filter, or add a new dinner idea.';
      grid.appendChild(msg);
      return;
    }

    filtered.forEach(dinner => {
      const meta = proteinMeta(dinner.protein);
      const macroTotals = dinnerMacroTotals(dinner);
      const card = document.createElement('div');
      card.className = 'card' + (pickedId === dinner.id ? ' picked' : '');
      card.id = 'dinner-' + dinner.id;

      card.innerHTML = `
        <div class="dot" style="background:${meta.color}"></div>
        <div class="protein-label" style="color:${meta.color}">${meta.label}</div>
        <h4>${escapeHtml(dinner.name)}</h4>
        ${(dinner.method || dinner.temp || dinner.time) ? `
          <div class="meta-row">
            <span class="meta-item">${dinner.method ? escapeHtml(methodLabel(dinner.method)) : ''}</span>
            <span class="meta-item">${dinner.temp ? escapeHtml(dinner.temp) : ''}</span>
            <span class="meta-item">${dinner.time ? escapeHtml(dinner.time) : ''}</span>
          </div>
        ` : ''}
        ${macroTotals ? `
          <div class="macro-row">${macroTotals.calories} kcal · ${Math.round(macroTotals.protein)}g protein · ${Math.round(macroTotals.carbs)}g carbs · ${Math.round(macroTotals.fat)}g fat</div>
        ` : ''}
        <div class="toggle-row">
          <button class="toggle-ing">
            Ingredients (${dinner.ingredients.length + (dinner.spices ? dinner.spices.length : 0)})
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          ${dinner.steps ? `
            <button class="toggle-steps">
              Steps
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          ` : ''}
        </div>
        <div class="ing-list">
          ${dinner.ingredients.map(i => {
            if (typeof i === 'string') return `<div>- ${escapeHtml(i)}</div>`;
            const amt = [i.amount, i.unit].filter(Boolean).join(' ');
            const state = i.state ? ` (${i.state})` : '';
            return `<div>- ${escapeHtml(i.name)}${amt ? ` — ${escapeHtml(amt)}` : ''}${escapeHtml(state)}</div>`;
          }).join('')}
          ${dinner.spices && dinner.spices.length ? `
            <div class="spice-heading">Spices</div>
            ${dinner.spices.map(s => `<div>- ${escapeHtml(s)}</div>`).join('')}
          ` : ''}
        </div>
        ${dinner.steps ? `<div class="steps-list">${escapeHtml(renumberStepsText(dinner.steps))}</div>` : ''}
        <div class="card-actions">
          <button class="edit-btn">Edit</button>
          <button class="del-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
            Remove
          </button>
        </div>
      `;

      const toggleBtn = card.querySelector('.toggle-ing');
      const ingList = card.querySelector('.ing-list');
      toggleBtn.onclick = () => {
        toggleBtn.classList.toggle('open');
        ingList.classList.toggle('open');
      };

      const toggleStepsBtn = card.querySelector('.toggle-steps');
      const stepsList = card.querySelector('.steps-list');
      if (toggleStepsBtn) {
        toggleStepsBtn.onclick = () => {
          toggleStepsBtn.classList.toggle('open');
          stepsList.classList.toggle('open');
        };
      }

      card.querySelector('.edit-btn').onclick = () => openForm(dinner);
      card.querySelector('.del-btn').onclick = () => {
        dinners = dinners.filter(d => d.id !== dinner.id);
        if (pickedId === dinner.id) pickedId = null;
        saveData();
        renderAll();
      };

      grid.appendChild(card);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return String(str == null ? '' : str).replace(/"/g, '&quot;');
  }

  function renderCount() {
    document.getElementById('countLabel').textContent =
      `${dinners.length} idea${dinners.length !== 1 ? 's' : ''} on file`;
  }

  function renderAll() {
    renderFilters();
    renderCards();
    renderCount();
  }

  function openForm(dinner) {
    editingId = dinner ? dinner.id : null;
    document.getElementById('formTitle').textContent = dinner ? 'Edit dinner' : 'Add a dinner idea';
    document.getElementById('saveBtn').textContent = dinner ? 'Save changes' : 'Add to the box';
    document.getElementById('nameInput').value = dinner ? dinner.name : '';
    document.getElementById('methodInput').value = dinner ? (dinner.method || '') : '';
    document.getElementById('tempInput').value = dinner ? (dinner.temp || '') : '';
    document.getElementById('timeInput').value = dinner ? (dinner.time || '') : '';
    document.getElementById('stepsInput').value = dinner ? renumberStepsText(dinner.steps || '') : '';
    renderIngredientRows(dinner ? dinner.ingredients : []);
    renderSpiceRows(dinner ? dinner.spices : []);
    document.getElementById('formWrap').classList.remove('hidden');
  }

  function closeForm() {
    editingId = null;
    document.getElementById('formWrap').classList.add('hidden');
    document.getElementById('macrosModal').classList.add('hidden');
  }

  let ingredientRowCount = 0;

  function renderIngredientRows(ingredients) {
    const wrap = document.getElementById('ingredientRows');
    wrap.innerHTML = '';
    ingredientRowCount = 0;
    if (ingredients && ingredients.length) {
      ingredients.forEach(ing => {
        if (typeof ing === 'string') {
          addIngredientRow(ing, '', 'g', '');
        } else {
          addIngredientRow(ing.name, ing.amount, ing.unit, ing.state || '', ing.macros || null);
        }
      });
    } else {
      addIngredientRow('', '', 'g', '');
    }
  }

  function addIngredientRow(name, amount, unit, state, macros) {
    const wrap = document.getElementById('ingredientRows');
    const rowId = 'ing-row-' + (ingredientRowCount++);
    const item = document.createElement('div');
    item.className = 'ingredient-item';
    const row = document.createElement('div');
    row.className = 'ingredient-row';
    row.id = rowId;
    row.innerHTML = `
      <input type="text" class="ing-name" placeholder="Ingredient name" value="${escapeAttr(name)}">
      <input type="number" class="ing-amount" placeholder="Amount" min="0" step="any" value="${escapeAttr(amount)}">
      <select class="ing-unit"></select>
      <select class="ing-state" title="Raw or cooked (optional)"></select>
      <button type="button" class="remove-ing-btn" title="Remove ingredient">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    `;
    const select = row.querySelector('.ing-unit');
    UNITS.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u;
      opt.textContent = u;
      if (u === (unit || 'g')) opt.selected = true;
      select.appendChild(opt);
    });
    const stateSelect = row.querySelector('.ing-state');
    STATES.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.value;
      opt.textContent = s.label;
      if (s.value === (state || '')) opt.selected = true;
      stateSelect.appendChild(opt);
    });
    const note = document.createElement('div');
    note.className = 'ing-macro-note';
    row.dataset.macros = macros ? JSON.stringify(macros) : '';
    if (macros) note.textContent = macroNoteText(macros);

    row.querySelector('.remove-ing-btn').onclick = () => item.remove();
    item.appendChild(row);
    item.appendChild(note);
    wrap.appendChild(item);

    const trigger = () => updateRowMacros(row);
    row.querySelector('.ing-name').addEventListener('blur', trigger);
    row.querySelector('.ing-amount').addEventListener('blur', trigger);
    row.querySelector('.ing-unit').addEventListener('change', trigger);
    row.querySelector('.ing-state').addEventListener('change', trigger);
  }

  function macroNoteText(macros) {
    const suffix = macros.manual ? ' (manual)' : '';
    return `≈ ${macros.calories} kcal · ${macros.protein}g protein · ${macros.carbs}g carbs · ${macros.fat}g fat${suffix}`;
  }

  async function updateRowMacros(row) {
    const existing = row.dataset.macros ? JSON.parse(row.dataset.macros) : null;
    if (existing && existing.manual) return;

    const name = row.querySelector('.ing-name').value.trim();
    const amount = row.querySelector('.ing-amount').value.trim();
    const unit = row.querySelector('.ing-unit').value;
    const state = row.querySelector('.ing-state').value;
    const note = row.nextElementSibling;

    if (!name || !amount) {
      row.dataset.macros = '';
      if (note) note.textContent = '';
      return;
    }
    if (!UNIT_TO_GRAMS[unit]) {
      row.dataset.macros = '';
      if (note) note.textContent = 'Use a weight or volume unit to estimate macros';
      return;
    }

    const token = Symbol();
    row._macroToken = token;
    if (note) note.textContent = 'Calculating macros…';

    const per100g = await fetchMacrosPer100g(name, state);
    if (row._macroToken !== token) return;

    const macros = scaleMacros(per100g, amount, unit);
    if (!macros) {
      row.dataset.macros = '';
      if (note) note.textContent = `No macro data found for "${name}"`;
      return;
    }
    row.dataset.macros = JSON.stringify(macros);
    if (note) note.textContent = macroNoteText(macros);
  }

  function getIngredientsFromForm() {
    const rows = document.querySelectorAll('#ingredientRows .ingredient-row');
    const result = [];
    rows.forEach(row => {
      const name = row.querySelector('.ing-name').value.trim();
      const amount = row.querySelector('.ing-amount').value.trim();
      const unit = row.querySelector('.ing-unit').value;
      const state = row.querySelector('.ing-state').value;
      const macros = row.dataset.macros ? JSON.parse(row.dataset.macros) : null;
      if (name) result.push({ name, amount, unit, state, macros });
    });
    return result;
  }

  let spiceRowCount = 0;

  function renderSpiceRows(spices) {
    const wrap = document.getElementById('spiceRows');
    wrap.innerHTML = '';
    spiceRowCount = 0;
    if (spices && spices.length) {
      spices.forEach(name => addSpiceRow(name));
    } else {
      addSpiceRow('');
    }
  }

  function addSpiceRow(name) {
    const wrap = document.getElementById('spiceRows');
    const rowId = 'spice-row-' + (spiceRowCount++);
    const row = document.createElement('div');
    row.className = 'spice-row';
    row.id = rowId;
    row.innerHTML = `
      <input type="text" class="spice-name" placeholder="Spice name" value="${escapeAttr(name)}">
      <button type="button" class="remove-ing-btn" title="Remove spice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    `;
    row.querySelector('.remove-ing-btn').onclick = () => row.remove();
    wrap.appendChild(row);
  }

  function getSpicesFromForm() {
    const rows = document.querySelectorAll('#spiceRows .spice-row');
    const result = [];
    rows.forEach(row => {
      const name = row.querySelector('.spice-name').value.trim();
      if (name) result.push(name);
    });
    return result;
  }

  function renumberStepsText(text) {
    if (!text) return '';
    return text.split('\n')
      .map(line => line.replace(/^\s*\d+\.\s?/, ''))
      .map((content, i) => `${i + 1}. ${content}`)
      .join('\n');
  }

  function handleStepsInput(e) {
    const ta = e.target;
    const cursorPos = ta.selectionStart;
    const rawLines = ta.value.split('\n');

    let pos = 0;
    let cursorLine = 0;
    let cursorOffsetInLine = 0;
    for (let i = 0; i < rawLines.length; i++) {
      const lineLen = rawLines[i].length;
      if (cursorPos <= pos + lineLen || i === rawLines.length - 1) {
        cursorLine = i;
        cursorOffsetInLine = cursorPos - pos;
        break;
      }
      pos += lineLen + 1;
    }

    const stripped = rawLines.map(line => line.replace(/^\s*\d+\.\s?/, ''));
    const originalPrefixLen = rawLines[cursorLine].length - stripped[cursorLine].length;
    const strippedCursorOffset = Math.max(0, cursorOffsetInLine - originalPrefixLen);

    const newLines = stripped.map((content, i) => `${i + 1}. ${content}`);
    const newValue = newLines.join('\n');

    if (newValue === ta.value) return;

    const newPrefixLen = String(cursorLine + 1).length + 2;
    let newCursorPos = newPrefixLen + strippedCursorOffset;
    for (let i = 0; i < cursorLine; i++) {
      newCursorPos += newLines[i].length + 1;
    }

    ta.value = newValue;
    ta.setSelectionRange(newCursorPos, newCursorPos);
  }

  function handleStepsFocus(e) {
    const ta = e.target;
    if (!ta.value) {
      ta.value = '1. ';
      ta.setSelectionRange(3, 3);
    }
  }

  function handleStepsKeydown(e) {
    if (e.key !== 'Backspace') return;
    const ta = e.target;
    if (ta.selectionStart !== ta.selectionEnd) return;
    const cursorPos = ta.selectionStart;
    const lines = ta.value.split('\n');

    let pos = 0;
    for (let i = 0; i < lines.length; i++) {
      const lineLen = lines[i].length;
      const lineEnd = pos + lineLen;
      if (cursorPos <= lineEnd || i === lines.length - 1) {
        const offsetInLine = cursorPos - pos;
        const match = lines[i].match(/^(\s*\d+\.\s?)/);
        const prefixLen = match ? match[1].length : 0;
        if (offsetInLine > prefixLen) return;

        e.preventDefault();

        if (i === 0) {
          ta.setSelectionRange(prefixLen, prefixLen);
          return;
        }

        const prevMatch = lines[i - 1].match(/^(\s*\d+\.\s?)/);
        const prevPrefixLen = prevMatch ? prevMatch[1].length : 0;
        const prevContent = lines[i - 1].slice(prevPrefixLen);
        const mergedContent = prevContent + lines[i].slice(prefixLen);

        const stripPrefix = l => l.replace(/^\s*\d+\.\s?/, '');
        const newLines = [
          ...lines.slice(0, i - 1).map(stripPrefix),
          mergedContent,
          ...lines.slice(i + 1).map(stripPrefix)
        ];
        const renumbered = newLines.map((content, idx) => `${idx + 1}. ${content}`);
        ta.value = renumbered.join('\n');

        let newCursorPos = 0;
        for (let k = 0; k < i - 1; k++) newCursorPos += renumbered[k].length + 1;
        newCursorPos += String(i).length + 2 + prevContent.length;
        ta.setSelectionRange(newCursorPos, newCursorPos);
        return;
      }
      pos = lineEnd + 1;
    }
  }

  function handleTempBlur(e) {
    const val = e.target.value.trim();
    if (/^\d+(\.\d+)?$/.test(val)) {
      e.target.value = val + 'C';
    }
  }

  function handleSave() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return;
    const ingredients = getIngredientsFromForm();
    const spices = getSpicesFromForm();
    const method = document.getElementById('methodInput').value;
    const temp = document.getElementById('tempInput').value.trim();
    const time = document.getElementById('timeInput').value.trim();
    const steps = document.getElementById('stepsInput').value.trim();

    const protein = detectProteinFromName(name);

    if (editingId) {
      dinners = dinners.map(d => d.id === editingId
        ? { ...d, name, protein, ingredients, spices, method, temp, time, steps }
        : d);
    } else {
      dinners = [{ id: 'dinner-' + Date.now(), name, protein, ingredients, spices, method, temp, time, steps }, ...dinners];
    }
    saveData();
    closeForm();
    renderAll();
  }

  function openMacrosModal() {
    const list = document.getElementById('macrosModalList');
    list.innerHTML = '';
    const rows = document.querySelectorAll('#ingredientRows .ingredient-row');

    rows.forEach(row => {
      const name = row.querySelector('.ing-name').value.trim();
      if (!name) return;
      const macros = row.dataset.macros ? JSON.parse(row.dataset.macros) : null;

      const entry = document.createElement('div');
      entry.className = 'macro-modal-row';
      entry.innerHTML = `
        <div class="macro-modal-info">
          <div class="macro-modal-name">${escapeHtml(name)}</div>
          <div class="macro-modal-current">${macros ? macroNoteText(macros) : 'No estimate yet'}</div>
        </div>
        <div class="macro-modal-inputs">
          <div><label>Kcal</label><input type="number" class="macro-in-kcal" min="0" step="any" value="${macros ? escapeAttr(macros.calories) : ''}"></div>
          <div><label>Protein</label><input type="number" class="macro-in-protein" min="0" step="any" value="${macros ? escapeAttr(macros.protein) : ''}"></div>
          <div><label>Carbs</label><input type="number" class="macro-in-carbs" min="0" step="any" value="${macros ? escapeAttr(macros.carbs) : ''}"></div>
          <div><label>Fat</label><input type="number" class="macro-in-fat" min="0" step="any" value="${macros ? escapeAttr(macros.fat) : ''}"></div>
        </div>
      `;
      entry._targetRow = row;
      list.appendChild(entry);
    });

    document.getElementById('macrosModal').classList.remove('hidden');
  }

  function closeMacrosModal() {
    document.getElementById('macrosModal').classList.add('hidden');
  }

  function saveMacrosModal() {
    const entries = document.querySelectorAll('#macrosModalList .macro-modal-row');
    entries.forEach(entry => {
      const row = entry._targetRow;
      const kcal = entry.querySelector('.macro-in-kcal').value.trim();
      const protein = entry.querySelector('.macro-in-protein').value.trim();
      const carbs = entry.querySelector('.macro-in-carbs').value.trim();
      const fat = entry.querySelector('.macro-in-fat').value.trim();
      const note = row.nextElementSibling;

      if (!kcal && !protein && !carbs && !fat) {
        row.dataset.macros = '';
        if (note) note.textContent = '';
        return;
      }

      const macros = {
        calories: Math.round(parseFloat(kcal) || 0),
        protein: parseFloat(protein) || 0,
        carbs: parseFloat(carbs) || 0,
        fat: parseFloat(fat) || 0,
        manual: true,
      };
      row.dataset.macros = JSON.stringify(macros);
      if (note) note.textContent = macroNoteText(macros);
    });
    closeMacrosModal();
  }

  function handlePickForMe() {
    const filtered = getFiltered();
    if (filtered.length === 0) return;
    const choice = filtered[Math.floor(Math.random() * filtered.length)];
    pickedId = choice.id;
    renderCards();
    setTimeout(() => {
      const el = document.getElementById('dinner-' + choice.id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  }

  document.getElementById('addBtn').onclick = () => openForm(null);
  document.getElementById('formCloseBtn').onclick = closeForm;
  document.getElementById('cancelBtn').onclick = closeForm;
  document.getElementById('saveBtn').onclick = handleSave;
  document.getElementById('searchInput').oninput = (e) => { searchTerm = e.target.value; renderCards(); };
  document.getElementById('pickBtn').onclick = handlePickForMe;
  document.getElementById('addIngredientBtn').onclick = () => addIngredientRow('', '', 'g', '');
  document.getElementById('addSpiceBtn').onclick = () => addSpiceRow('');
  document.getElementById('macrosBtn').onclick = openMacrosModal;
  document.getElementById('macrosModalCloseBtn').onclick = closeMacrosModal;
  document.getElementById('macrosModalCancelBtn').onclick = closeMacrosModal;
  document.getElementById('macrosModalSaveBtn').onclick = saveMacrosModal;
  document.getElementById('stepsInput').addEventListener('keydown', handleStepsKeydown);
  document.getElementById('stepsInput').addEventListener('input', handleStepsInput);
  document.getElementById('stepsInput').addEventListener('focus', handleStepsFocus);
  document.getElementById('tempInput').addEventListener('blur', handleTempBlur);

  function showAuthError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function clearAuthError() {
    document.getElementById('authError').classList.add('hidden');
  }

  function showVerifyError(msg) {
    const el = document.getElementById('verifyError');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function clearVerifyError() {
    document.getElementById('verifyError').classList.add('hidden');
  }

  function friendlyAuthError(e) {
    const map = {
      'auth/invalid-email': 'That email address looks invalid.',
      'auth/user-not-found': 'No account found with that email.',
      'auth/wrong-password': 'Incorrect password.',
      'auth/invalid-credential': 'Incorrect email or password.',
      'auth/email-already-in-use': 'An account with that email already exists.',
      'auth/weak-password': 'Password should be at least 6 characters.',
    };
    return map[e.code] || e.message;
  }

  function showScreen(id) {
    ['authScreen', 'verifyScreen', 'appContent'].forEach(sid => {
      document.getElementById(sid).classList.toggle('hidden', sid !== id);
    });
  }

  async function attemptSignUp() {
    clearAuthError();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await sendEmailVerification(cred.user);
    } catch (e) {
      showAuthError(friendlyAuthError(e));
    }
  }

  async function attemptSignIn({ fallbackToSignUp } = {}) {
    clearAuthError();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      if (fallbackToSignUp && e.code === 'auth/user-not-found') {
        await attemptSignUp();
      } else {
        showAuthError(friendlyAuthError(e));
      }
    }
  }

  document.getElementById('signInBtn').onclick = () => attemptSignIn();
  document.getElementById('signUpBtn').onclick = () => attemptSignUp();

  function handleAuthEnterKey(e) {
    if (e.key !== 'Enter') return;
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || !password) return;
    attemptSignIn({ fallbackToSignUp: true });
  }
  document.getElementById('authEmail').addEventListener('keydown', handleAuthEnterKey);
  document.getElementById('authPassword').addEventListener('keydown', handleAuthEnterKey);

  async function doSignOut() {
    try {
      await pendingSave;
      await signOut(auth);
    } catch (e) {
      console.error('Sign out failed', e);
    }
  }
  document.getElementById('signOutBtn').onclick = doSignOut;
  document.getElementById('verifySignOutBtn').onclick = doSignOut;

  document.getElementById('resendVerificationBtn').onclick = async () => {
    clearVerifyError();
    try {
      await sendEmailVerification(auth.currentUser);
      showVerifyError('Verification email sent — check your inbox (and spam folder).');
    } catch (e) {
      showVerifyError(e.message);
    }
  };

  document.getElementById('verifyContinueBtn').onclick = async () => {
    clearVerifyError();
    try {
      await auth.currentUser.reload();
      if (auth.currentUser.emailVerified) {
        handleAuthUser(auth.currentUser);
      } else {
        showVerifyError('Still not verified yet — check your inbox and click the link, then try again.');
      }
    } catch (e) {
      showVerifyError(e.message);
    }
  };

  async function handleAuthUser(user) {
    if (stopSync) { stopSync(); stopSync = null; }

    if (!user) {
      dinnerDocRef = null;
      dinners = [];
      editingId = null;
      document.getElementById('formWrap').classList.add('hidden');
      document.getElementById('authEmail').value = '';
      document.getElementById('authPassword').value = '';
      clearAuthError();
      showScreen('authScreen');
      return;
    }

    if (!user.emailVerified) {
      document.getElementById('verifyEmailMsg').textContent = `We've sent a verification link to ${user.email}. Verify your email, then continue below.`;
      clearVerifyError();
      showScreen('verifyScreen');
      return;
    }

    // Force-refresh the ID token so Firestore rules see an up-to-date email_verified claim
    // (the token can otherwise stay stale right after verifying, in the same session).
    try {
      await user.getIdToken(true);
    } catch (e) {
      console.error('Session is no longer valid, signing out', e);
      await signOut(auth).catch(() => {});
      return;
    }

    document.getElementById('userEmailLabel').textContent = user.email;
    clearAuthError();
    showScreen('appContent');
    startSync(user.uid);
  }

  onAuthStateChanged(auth, handleAuthUser);
</script>
