<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Main Meal — Sign in</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <div class="auth-screen" id="loadingScreen">
    <h1>The Main Meal</h1>
    <p class="subtitle">Loading…</p>
  </div>

  <div class="auth-screen hidden" id="authScreen">
    <h1>The Main Meal</h1>
    <p class="subtitle">Sign in to see your own meal box</p>
    <div class="auth-form">
      <input class="field-input" id="authEmail" type="email" placeholder="Email" autocomplete="email">
      <input class="field-input" id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
      <p class="auth-error hidden" id="authError"></p>
      <div class="auth-actions">
        <button class="save-btn" id="signInBtn">Sign in</button>
        <button class="cancel-btn" id="goToSignUpBtn">Create account</button>
      </div>
      <div class="auth-divider"><span>or</span></div>
      <button class="google-btn" id="googleSignInBtn">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-2.1 14-5.5l-6.5-5.5C29.4 34.9 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.4l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.5 5.5C41.4 35.9 44 30.4 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <div class="auth-screen hidden" id="signUpScreen">
    <h1>Create account</h1>
    <p class="subtitle">Set up your own meal box</p>
    <div class="auth-form">
      <input class="field-input" id="signUpEmail" type="email" placeholder="Email" autocomplete="email">
      <input class="field-input" id="signUpPassword" type="password" placeholder="Password" autocomplete="new-password">
      <input class="field-input" id="signUpPasswordConfirm" type="password" placeholder="Confirm password" autocomplete="new-password">
      <p class="auth-error hidden" id="signUpError"></p>
      <div class="auth-actions">
        <button class="save-btn" id="signUpSubmitBtn">Create account</button>
        <button class="cancel-btn" id="signUpBackBtn">Back to sign in</button>
      </div>
    </div>
  </div>

  <div class="auth-screen hidden" id="verifyScreen">
    <h1>Verify your email</h1>
    <p class="subtitle" id="verifyEmailMsg">We've sent a verification link to your email.</p>
    <p class="auth-error hidden" id="verifyError"></p>
    <div class="auth-actions">
      <button class="save-btn" id="verifyContinueBtn">I've verified — continue</button>
    </div>
    <div class="auth-actions">
      <button class="cancel-btn" id="resendVerificationBtn">Resend email</button>
      <button class="cancel-btn" id="verifySignOutBtn">Sign out</button>
    </div>
  </div>
</div>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, GoogleAuthProvider, signInWithPopup, linkWithCredential } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  let pendingGoogleCredential = null;

  // New accounts (no dinnerBox doc yet, or one saved before the onboarded
  // flag existed) land on preferences.html to set a nickname and food
  // likes/dislikes before seeing the main menu.
  async function resolveLandingPage(uid) {
    try {
      // Right after verifying, the cached ID token can still carry a stale
      // email_verified: false claim until force-refreshed — without this,
      // Firestore rules gating reads on that claim silently reject the
      // getDoc below, which would otherwise wrongly default to index.html.
      await auth.currentUser.getIdToken(true);
      const snap = await getDoc(doc(db, 'dinnerBox', uid));
      const onboarded = snap.exists() && snap.data().onboarded === true;
      return onboarded ? 'index.html' : 'preferences.html';
    } catch (e) {
      console.error('Could not check onboarding status, defaulting to main menu', e);
      return 'index.html';
    }
  }

  function showScreen(id) {
    ['loadingScreen', 'authScreen', 'signUpScreen', 'verifyScreen'].forEach(sid => {
      document.getElementById(sid).classList.toggle('hidden', sid !== id);
    });
  }

  function showAuthError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function clearAuthError() {
    document.getElementById('authError').classList.add('hidden');
  }

  function showVerifyError(msg) {
    const el = document.getElementById('verifyError');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function clearVerifyError() {
    document.getElementById('verifyError').classList.add('hidden');
  }

  function friendlyAuthError(e) {
    const map = {
      'auth/invalid-email': 'That email address looks invalid.',
      'auth/user-not-found': 'No account found with that email.',
      'auth/wrong-password': 'Incorrect password.',
      'auth/invalid-credential': 'Incorrect email or password.',
      'auth/email-already-in-use': 'An account with that email already exists.',
      'auth/weak-password': 'Password should be at least 6 characters.',
    };
    return map[e.code] || e.message;
  }

  function showSignUpScreen() {
    document.getElementById('signUpEmail').value = document.getElementById('authEmail').value.trim();
    document.getElementById('signUpPassword').value = '';
    document.getElementById('signUpPasswordConfirm').value = '';
    document.getElementById('signUpError').classList.add('hidden');
    showScreen('signUpScreen');
  }

  function showSignInScreen() {
    document.getElementById('authError').classList.add('hidden');
    showScreen('authScreen');
  }

  async function attemptSignUp() {
    const errorEl = document.getElementById('signUpError');
    errorEl.classList.add('hidden');
    const emailInput = document.getElementById('signUpEmail');
    const passwordInput = document.getElementById('signUpPassword');
    const confirmInput = document.getElementById('signUpPasswordConfirm');
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;

    if (!email) {
      errorEl.textContent = 'Please enter an email address.';
      errorEl.classList.remove('hidden');
      emailInput.focus();
      return;
    }
    if (!password) {
      errorEl.textContent = 'Please enter a password.';
      errorEl.classList.remove('hidden');
      passwordInput.focus();
      return;
    }
    if (!confirmPassword) {
      errorEl.textContent = 'Please confirm your password.';
      errorEl.classList.remove('hidden');
      confirmInput.focus();
      return;
    }
    if (password !== confirmPassword) {
      errorEl.textContent = "Passwords don't match.";
      errorEl.classList.remove('hidden');
      return;
    }

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await sendEmailVerification(cred.user);
    } catch (e) {
      errorEl.textContent = friendlyAuthError(e);
      errorEl.classList.remove('hidden');
    }
  }

  async function attemptSignIn() {
    clearAuthError();
    const emailInput = document.getElementById('authEmail');
    const passwordInput = document.getElementById('authPassword');
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email) {
      showAuthError('Please enter your email address.');
      emailInput.focus();
      return;
    }
    if (!password) {
      showAuthError('Please enter your password.');
      passwordInput.focus();
      return;
    }
    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      if (pendingGoogleCredential) {
        const toLink = pendingGoogleCredential;
        pendingGoogleCredential = null;
        await linkWithCredential(cred.user, toLink).catch(e => console.error('Could not link Google account', e));
      }
    } catch (e) {
      showAuthError(friendlyAuthError(e));
    }
  }

  document.getElementById('signInBtn').onclick = () => attemptSignIn();
  document.getElementById('goToSignUpBtn').onclick = showSignUpScreen;
  document.getElementById('signUpBackBtn').onclick = showSignInScreen;
  document.getElementById('signUpSubmitBtn').onclick = attemptSignUp;

  document.getElementById('googleSignInBtn').onclick = async () => {
    clearAuthError();
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (e) {
      if (e.code === 'auth/account-exists-with-different-credential') {
        pendingGoogleCredential = GoogleAuthProvider.credentialFromError(e);
        const existingEmail = e.customData && e.customData.email;
        if (existingEmail) document.getElementById('authEmail').value = existingEmail;
        document.getElementById('authPassword').value = '';
        showAuthError('An account already exists with that email. Enter your password and sign in to link your Google account.');
      } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
        showAuthError(friendlyAuthError(e));
      }
    }
  };

  function handleAuthEnterKey(e) {
    if (e.key !== 'Enter') return;
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || !password) return;
    attemptSignIn();
  }
  document.getElementById('authEmail').addEventListener('keydown', handleAuthEnterKey);
  document.getElementById('authPassword').addEventListener('keydown', handleAuthEnterKey);

  function handleSignUpEnterKey(e) {
    if (e.key === 'Enter') attemptSignUp();
  }
  document.getElementById('signUpEmail').addEventListener('keydown', handleSignUpEnterKey);
  document.getElementById('signUpPassword').addEventListener('keydown', handleSignUpEnterKey);
  document.getElementById('signUpPasswordConfirm').addEventListener('keydown', handleSignUpEnterKey);

  async function doSignOut() {
    try {
      await signOut(auth);
    } catch (e) {
      console.error('Sign out failed', e);
    }
  }
  document.getElementById('verifySignOutBtn').onclick = doSignOut;

  document.getElementById('resendVerificationBtn').onclick = async () => {
    clearVerifyError();
    try {
      await sendEmailVerification(auth.currentUser);
      showVerifyError('Verification email sent — check your inbox (and spam folder).');
    } catch (e) {
      showVerifyError(e.message);
    }
  };

  document.getElementById('verifyContinueBtn').onclick = async () => {
    clearVerifyError();
    try {
      await auth.currentUser.reload();
      if (auth.currentUser.emailVerified) {
        sessionStorage.setItem('mm-authed', '1');
        sessionStorage.setItem('mm-uid', auth.currentUser.uid);
        window.location.href = await resolveLandingPage(auth.currentUser.uid);
      } else {
        showVerifyError('Still not verified yet — check your inbox and click the link, then try again.');
      }
    } catch (e) {
      showVerifyError(e.message);
    }
  };

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      document.getElementById('authEmail').value = '';
      document.getElementById('authPassword').value = '';
      clearAuthError();
      showScreen('authScreen');
      return;
    }
    if (!user.emailVerified) {
      document.getElementById('verifyEmailMsg').textContent = `We've sent a verification link to ${user.email}. Verify your email, then continue below.`;
      clearVerifyError();
      showScreen('verifyScreen');
      return;
    }
    sessionStorage.setItem('mm-authed', '1');
    sessionStorage.setItem('mm-uid', user.uid);
    resolveLandingPage(user.uid).then((target) => {
      window.location.href = target;
    });
  });
</script>

</body>
</html>
